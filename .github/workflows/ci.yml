name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run for the same ref pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth; Netlify reads it too, so CI
          # and the deploy build can never disagree about the Node version.
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: installs exactly the lockfile and fails if the two
      # have drifted, which is the point of running this at all.
      - run: npm ci

      # Kept as separate steps so a failure says which thing broke, rather
      # than "the build failed".
      - run: npm run typecheck

      # Runs the suite and enforces the per-target coverage thresholds in
      # vite.config.ts. Netlify deliberately runs plain `npm test` instead, so
      # a coverage dip cannot stand between a fix and production.
      - run: npm run coverage

      - run: npm run build

      # Uploaded even on failure: when a threshold trips, this is the report
      # that says which lines stopped being covered.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
